
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial Clasificado - Métricas Zepp & Nutrición</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-orange: #f97316;
      --accent-purple: #a855f7;
      --accent-pink: #ec4899;
      --accent-cyan: #06b6d4;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }


    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px;
      min-height: 100vh;
    }


    .container {
      max-width: 1280px;
      margin: 0 auto;
    }


    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 16px;
    }


    .btn-back {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }


    .btn-back:hover {
      background: rgba(56, 189, 248, 0.25);
      transform: translateY(-1px);
    }


    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      margin-bottom: 24px;
    }


    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }


    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }


    .pill-btn {
      background: #0b0f19;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }


    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }


    .pill-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }


    .pill-count {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.72rem;
    }


    .search-box {
      background: #0b0f19;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      width: 240px;
    }


    .search-box:focus {
      outline: none;
      border-color: var(--accent-blue);
    }


    .sort-btn {
      background: #0b0f19;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }


    .sort-btn:hover {
      color: var(--text-main);
    }


    .table-responsive {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }


    .records-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }


    .records-table th {
      background: #0d1322;
      color: var(--text-muted);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
      white-space: nowrap;
    }


    .records-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(31, 41, 55, 0.6);
      color: var(--text-main);
      vertical-align: middle;
    }


    .records-table tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }


    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      white-space: nowrap;
    }


    .badge-nutrition { background: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-activity { background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-sleep { background: rgba(168, 85, 247, 0.12); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-vitals { background: rgba(249, 115, 22, 0.12); color: #f97316; border: 1px solid rgba(249, 115, 22, 0.3); }
    .badge-weight { background: rgba(6, 182, 212, 0.12); color: #06b6d4; border: 1px solid rgba(6, 182, 212, 0.3); }


    .tag-note {
      color: #d1d5db;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 style="font-size: 1.5rem; font-weight: 800;">Historial Cronológico de Registros</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 2px;">Métricas de Amazfit Zepp, Health Connect & Registro Nutricional</p>
      </div>
      <div>
        <a href="index.html" class="btn-back">⬅ Volver al Dashboard</a>
      </div>
    </header>


    <div class="card">
      <!-- Filter and Search Bar -->
      <div class="filter-bar">
        <div class="category-pills">
          <button class="pill-btn active" onclick="filterRecords('ALL', this)">
            <span>🌟 Todos</span> <span class="pill-count" id="countAll">0</span>
          </button>
          <button class="pill-btn" onclick="filterRecords('NUTRITION', this)">
            <span>🥗 Nutrición & Déficit</span> <span class="pill-count" id="countNutrition">0</span>
          </button>
          <button class="pill-btn" onclick="filterRecords('ACTIVITY', this)">
            <span>🏃 Actividad & Pasos</span> <span class="pill-count" id="countActivity">0</span>
          </button>
          <button class="pill-btn" onclick="filterRecords('SLEEP', this)">
            <span>💤 Arquitectura Sueño</span> <span class="pill-count" id="countSleep">0</span>
          </button>
          <button class="pill-btn" onclick="filterRecords('VITALS', this)">
            <span>❤️ Biomarcadores / FC</span> <span class="pill-count" id="countVitals">0</span>
          </button>
          <button class="pill-btn" onclick="filterRecords('WEIGHT', this)">
            <span>⚖️ Composición / Peso</span> <span class="pill-count" id="countWeight">0</span>
          </button>
        </div>


        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="text" id="recordSearch" class="search-box" placeholder="Buscar fecha, comida, notas..." oninput="handleSearch()">
          <button class="sort-btn" id="btnSort" onclick="toggleSort()">
            <span id="sortIcon">⬇️</span> <span id="sortText">Más recientes</span>
          </button>
        </div>
      </div>


      <!-- Table of Classified Records -->
      <div class="table-responsive">
        <table class="records-table">
          <thead>
            <tr>
              <th>Fecha / Hora</th>
              <th>Tipo / Categoría</th>
              <th>Métricas Principales</th>
              <th>Métricas Secundarias</th>
              <th>Detalles / Observaciones</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>


  <script>
    const rawRecords = [

      { date: '2026-09-09', type: 'SLEEP', badge: 'badge-sleep', typeLabel: '💤 Sueño', primary: '6h 17m total (01:49 - 08:06)', secondary: 'Profundo: 58m | REM: 97m | Ligero: 221m', details: 'Pico elevado de fase REM (97m)' },

      { date: '2026-09-02', type: 'SLEEP', badge: 'badge-sleep', typeLabel: '💤 Sueño', primary: '6h 00m total (02:07 - 08:07)', secondary: 'Profundo: 66m | REM: 57m | Ligero: 237m', details: 'Inicio de semana con buena proporción profunda' },

      { date: '2026-09-11', type: 'VITALS', badge: 'badge-vitals', typeLabel: '❤️ Signos Vitales', primary: 'FC Reposo: 48 lpm', secondary: 'HRV: 110.2 ms | SpO2: 98.2%', details: 'Pico de HRV semanal (110 ms - recuperación alta)' },

      { date: '2026-09-04', type: 'VITALS', badge: 'badge-vitals', typeLabel: '❤️ Signos Vitales', primary: 'FC Reposo: 48 lpm', secondary: 'HRV: 89.8 ms | SpO2: 97.8%', details: 'Leve caída de HRV post noche corta' },

      { date: '2026-09-02', type: 'VITALS', badge: 'badge-vitals', typeLabel: '❤️ Signos Vitales', primary: 'FC Reposo: 50 lpm', secondary: 'HRV: 107.5 ms | SpO2: 96.8%', details: 'FC max: 117 lpm | media: 71.6 lpm' },
      { date: '2026-09-01', type: 'VITALS', badge: 'badge-vitals', typeLabel: '❤️ Signos Vitales', primary: 'FC Promedio: 73.5 lpm', secondary: 'FC Min: 54 | Max: 114 | SpO2: 97.1%', details: 'Registro inicial de septiembre' }
    ];


    let currentCategory = 'ALL';
    let sortDescending = true;


    function updateCounters() {
      document.getElementById('countAll').textContent = rawRecords.length;
      document.getElementById('countNutrition').textContent = rawRecords.filter(r => r.type === 'NUTRITION').length;
      document.getElementById('countActivity').textContent = rawRecords.filter(r => r.type === 'ACTIVITY').length;
      document.getElementById('countSleep').textContent = rawRecords.filter(r => r.type === 'SLEEP').length;
      document.getElementById('countVitals').textContent = rawRecords.filter(r => r.type === 'VITALS').length;
      document.getElementById('countWeight').textContent = rawRecords.filter(r => r.type === 'WEIGHT').length;
    }


    function renderRecordsTable() {
      const tbody = document.getElementById('recordsTableBody');
      const searchTerm = document.getElementById('recordSearch').value.toLowerCase().trim();


      let filtered = rawRecords.filter(r => {
        const matchesCategory = (currentCategory === 'ALL' || r.type === currentCategory);
        const matchesSearch = !searchTerm || 
          r.date.toLowerCase().includes(searchTerm) ||
          r.primary.toLowerCase().includes(searchTerm) ||
          r.secondary.toLowerCase().includes(searchTerm) ||
          r.details.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });


      filtered.sort((a, b) => {
        const dateA = new Date(a.date.replace(' ', 'T')).getTime();
        const dateB = new Date(b.date.replace(' ', 'T')).getTime();
        return sortDescending ? (dateB - dateA) : (dateA - dateB);
      });


      tbody.innerHTML = '';


      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 32px;">No se encontraron registros.</td></tr>`;
        return;
      }


      filtered.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight: 700; white-space: nowrap; color: #fff;">${r.date}</td>
          <td><span class="type-badge ${r.badge}">${r.typeLabel}</span></td>
          <td style="font-weight: 600;">${r.primary}</td>
          <td style="color: var(--text-muted);">${r.secondary}</td>
          <td><span class="tag-note">${r.details}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }


    function filterRecords(category, btnElement) {
      currentCategory = category;
      document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      renderRecordsTable();
    }


    function handleSearch() {
      renderRecordsTable();
    }


    function toggleSort() {
      sortDescending = !sortDescending;
      document.getElementById('sortIcon').textContent = sortDescending ? '⬇️' : '⬆️';
      document.getElementById('sortText').textContent = sortDescending ? 'Más recientes' : 'Más antiguos';
      renderRecordsTable();
    }


    updateCounters();
    renderRecordsTable();
  </script>
</body>
</html>
